name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      run: |
        echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
        echo "$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

    - name: Accept Android SDK Licenses
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Install Android SDK Components
      run: |
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install \
          "platforms;android-34" \
          "build-tools;34.0.0" \
          "platform-tools"

    - name: Install NDK
      run: |
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653"
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android

    - name: Install cargo-xdk
      run: cargo install cargo-xdk

    - name: Download ROM files
      run: |
        mkdir -p app/src/main/assets
        curl -sL -o app/src/main/assets/rootfs.7z "https://github.com/nike64542-byte/twoyi/releases/download/v0.5.4/rootfs.7z"
        curl -sL -o app/src/main/assets/rom.ini "https://github.com/nike64542-byte/twoyi/releases/download/v0.5.4/rom.ini"
        ls -la app/src/main/assets/

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleRelease

    - name: Generate Keystore
      run: |
        keytool -genkeypair -v -keystore release.keystore -alias twoyi -keyalg RSA -keysize 2048 -validity 10000 -storepass ${{ secrets.KEYSTORE_PASSWORD }} -keypass ${{ secrets.KEYSTORE_PASSWORD }} -dname "CN=Twoyi, OU=Dev, O=Twoyi, L=Beijing, ST=BJ, C=CN"

    - name: Sign APK
      run: |
        APK_FILE=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
        echo "Found APK: $APK_FILE"
        if [ -z "$APK_FILE" ]; then
          echo "No APK found!"
          ls -la app/build/outputs/apk/release/ || echo "Directory not found"
          exit 1
        fi
        mkdir -p signed
        $ANDROID_HOME/build-tools/34.0.0/zipalign -v -p 4 "$APK_FILE" signed/twoyi-aligned.apk
        $ANDROID_HOME/build-tools/34.0.0/apksigner sign --ks release.keystore --ks-pass pass:${{ secrets.KEYSTORE_PASSWORD }} --key-pass pass:${{ secrets.KEYSTORE_PASSWORD }} --ks-key-alias twoyi --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out signed/twoyi.apk signed/twoyi-aligned.apk

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: twoyi-apk
        path: signed/twoyi.apk
        retention-days: 30
